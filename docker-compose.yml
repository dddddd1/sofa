# 本地开发依赖：postgres + redis + minio（S3 替代）
# 用法：docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: harper-pg
    environment:
      POSTGRES_USER: harper
      POSTGRES_PASSWORD: harper_dev
      POSTGRES_DB: harper
    ports:
      - "5432:5432"
    volumes:
      - harper_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: harper-redis
    ports:
      - "6379:6379"
    volumes:
      - harper_redis:/data

  minio:
    image: minio/minio:latest
    container_name: harper-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: harper
      MINIO_ROOT_PASSWORD: harper_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - harper_minio:/data

volumes:
  harper_pg:
  harper_redis:
  harper_minio:
